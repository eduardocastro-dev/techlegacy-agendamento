<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TechLegacy Agendamento</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <div class="brand">
                    <h1>TechLegacy</h1>
                    <span>Agendamento</span>
                </div>

                <h2>Entrar na sua conta</h2>

                <p>
                    Acesse o painel do seu estabelecimento.
                </p>

            </div>


            <form id="login-form" class="login-form">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <input type="password" id="password" name="password" placeholder="Digite sua senha"
                        autocomplete="current-password" required>

                </div>


                <div id="login-message" class="login-message" hidden></div>


                <button type="submit" id="login-button" class="login-button">
                    Entrar
                </button>

            </form>


            <div class="login-footer">

                <span>Ainda não possui uma conta?</span>

                <a href="/cadastro">
                    Criar conta
                </a>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
